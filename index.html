    <script>
      // Remove the loader as soon as React mounts. Never leave a blank screen:
      // when startup cannot complete, keep a visible recovery action instead.
      window.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('global-loader');
        var finish = function() {
          if (!loader) return;
          sessionStorage.removeItem('zorlu-chunk-reload');
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 150);
        };
        if (root && root.children.length > 0) {
          finish();
        } else if (root) {
          var observer = new MutationObserver(function() {
            if (root.children.length > 0) {
              observer.disconnect();
              finish();
            }
          });
          observer.observe(root, { childList: true });
        }
        setTimeout(function() {
          if (loader && document.body.contains(loader)) {
            var message = loader.querySelector('p');
            if (message) message.textContent = 'Yükleme tamamlanamadı';
            var retry = document.createElement('a');
            retry.href = window.location.href;
            retry.textContent = 'Yeniden dene';
            retry.style.cssText = 'display:inline-flex;margin-top:16px;padding:12px 20px;border-radius:6px;background:hsl(221,83%,53%);color:white;font:600 14px Plus Jakarta Sans,sans-serif;text-decoration:none';
            var box = loader.firstElementChild;
            if (box && !box.querySelector('a')) box.appendChild(retry);
          }
        }, 10000);
      });
      window.addEventListener('vite:preloadError', function() {
        var reloadKey = 'zorlu-chunk-reload';
        if (!sessionStorage.getItem(reloadKey)) {
          sessionStorage.setItem(reloadKey, '1');
          window.location.reload();
        }
      });
    </script>
